
name: Build Kenomotion Phase 1 IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Phase 1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -type f -iname '*phase1*.zip' -not -path './build/*' | head -n 1)"
          if [[ -z "$ZIP" ]]; then
            echo "ERROR: ZIP Phase 1 tidak ditemukan di repository."
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Source ZIP: $ZIP"
          mkdir -p extracted
          ditto -x -k "$ZIP" extracted

      - name: Locate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find extracted -type d -name '*.xcodeproj' -print -quit)"
          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: Tidak ada .xcodeproj di dalam ZIP."
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Detect scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -json -project "$PROJECT" > schemes.json
          SCHEME="$(python3 -c 'import json; d=json.load(open("schemes.json")); print(d["project"]["schemes"][0] if d["project"]["schemes"] else "")')"
          if [[ -z "$SCHEME" ]]; then
            echo "ERROR: Scheme tidak ditemukan."
            cat schemes.json
            exit 1
          fi
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      - name: Build iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP" ]]; then
            echo "ERROR: Build selesai tanpa menghasilkan .app."
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Kenomotion_Phase1.ipa
          ls -lh Kenomotion_Phase1.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kenomotion-Phase1-IPA
          path: Kenomotion_Phase1.ipa
          if-no-files-found: error
