
name: Kenomotion iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'Kenomotion_Native_iOS_Starter.zip'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Kenomotion_Native_iOS_Starter.zip -d extracted
          find extracted -name '*.xcodeproj' -print

      - name: Build Kenomotion
        run: |
          PROJECT=$(find extracted -name '*.xcodeproj' -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -project "$PROJECT" | sed -n '/Schemes:/,$p' | sed -n '2p' | xargs)

          if [ -z "$SCHEME" ]; then
            echo "Xcode scheme not found"
            exit 1
          fi

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/DerivedData/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -print -quit)

          if [ -z "$APP" ]; then
            echo "App build output not found"
            exit 1
          fi

          mkdir -p output/Payload
          ditto "$APP" "output/Payload/$(basename "$APP")"

          cd output
          zip -r Kenomotion-unsigned.ipa Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kenomotion-unsigned-IPA
          path: output/Kenomotion-unsigned.ipa
          if-no-files-found: error
